<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Portfolio</title>
    <script>
      (function(){
        var base = './';
        if (window.location.protocol === 'https:' || window.location.protocol === 'http:') {
          var path = window.location.pathname.replace(/\/$/, '');
          var segments = path.split('/').filter(Boolean);
          if (segments.length > 0) { base = '/' + segments[0] + '/'; }
          else { base = '/'; }
        }
        document.write('<base href="' + base + '">');
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            bg: '#e1ddc4',
                            text: '#020204',
                        },
                        dark: {
                            bg: '#1a1a1a',
                            text: '#e1ddc4',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .theme-light { --bg: #e1ddc4; --text: #020204; --card: #f5f3e8; --header: #020204; --header-text: #e1ddc4; }
        .theme-dark { --bg: #1a1a1a; --text: #e1ddc4; --card: #2d2d2d; --header: #2d2d2d; --header-text: #e1ddc4; }
        body { background-color: var(--bg); color: var(--text); }
        header { background-color: var(--header); color: var(--header-text); }
        .card-bg { background-color: var(--card); }
    </style>
</head>
<body class="theme-light min-h-screen transition-colors duration-300">
    <header class="py-4 shadow-md sticky top-0 z-50">

                <ul class="nav-menu hidden md:flex flex-col md:flex-row absolute md:static top-16 left-0 w-full md:w-auto bg-[#020204] md:bg-transparent gap-2 md:gap-8 py-4 md:py-0" id="nav-menu">
                    <li><a href="index.html" class="block py-2 px-4 md:px-0 hover:opacity-80 transition-opacity font-medium">Home</a></li>
                    <li><a href="projects.html" class="block py-2 px-4 md:px-0 hover:opacity-80 transition-opacity font-medium">Projects</a></li>
                    <li><a href="involvements.html" class="block py-2 px-4 md:px-0 hover:opacity-80 transition-opacity font-medium">Involvements</a></li>
                    <li><a href="skill.html" class="block py-2 px-4 md:px-0 hover:opacity-80 transition-opacity font-medium">Skills</a></li>
                    <li><a href="about.html" class="block py-2 px-4 md:px-0 hover:opacity-80 transition-opacity font-medium">About</a></li>
                    <li><a href="contacts.html" class="block py-2 px-4 md:px-0 hover:opacity-80 transition-opacity font-medium active">Contact</a></li>
                </ul>
                <div class="theme-toggle-container flex items-center">
                    <button id="theme-toggle" class="theme-toggle w-10 h-10 border-2 rounded-full flex items-center justify-center transition-all hover:scale-105" aria-label="Toggle theme">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="maintenance-container flex flex-col justify-center items-center min-h-[70vh] text-center px-4 py-10 fade-in-up">
            <div class="maintenance-robot mb-6 relative">
                <div class="w-28 h-28 rounded-full glass-card shadow-xl flex items-center justify-center text-6xl font-bold mx-auto floating">✕</div>
            </div>
            <h2 class="maintenance-text text-3xl md:text-4xl font-bold mb-6 gradient-text">Under Maintenance</h2>
            <p class="maintenance-subtext text-lg md:text-xl max-w-lg leading-relaxed opacity-70">This page is currently being worked on. Please check back later or contact me through my social links in the About page.</p>
        </div>
    </main>

    <footer class="text-center py-8 mt-12">
        <p class="opacity-80">© 2025 Amirul Faris Roslan. All rights reserved.</p>
    </footer>
    <script src="js/theme.js"></script>
    <script src="js/mobile-nav.js"></script>
</body>
</html>
